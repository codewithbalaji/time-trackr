name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch/PR cancels the still-running run for the
# previous one — no point finishing a check for a commit that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  database:
    name: RLS / pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` applies every migration in supabase/migrations/ to a
      # fresh local Postgres — this is what caught the Phase 8 migration bug
      # (see ADR-0009), so a failure here means the migration history itself
      # is broken, not just the pgTAP assertions.
      - run: supabase start
      - run: supabase test db
