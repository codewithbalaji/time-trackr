<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification code - Time Trackr</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; color: #f1f5f9;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #0b0f17; min-height: 100vh; padding: 48px 16px;">
    <tr>
      <td align="center" valign="top">
        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 520px; background-color: #141b26; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
          <!-- Header -->
          <tr>
            <td style="padding: 32px 36px 24px 36px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: left;">
              <table role="presentation" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px;">
                    <span style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
                        <circle cx="12" cy="12" r="10" stroke="#2dd4bf" stroke-width="2.5"/>
                        <path d="M12 6V12L16 14" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
                      </svg>
                    </span>
                    <span style="vertical-align: middle;">Time <span style="color: #2dd4bf;">Trackr</span></span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 36px 36px 28px 36px;">
              <h1 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 600; color: #ffffff; line-height: 1.3;">
                Your verification code
              </h1>
              <p style="margin: 0 0 24px 0; font-size: 15px; color: #94a3b8; line-height: 1.6;">
                Use the following 6-digit verification code to complete your action in Time Trackr:
              </p>

              <!-- OTP Code Display -->
              <table role="presentation" border="0" cellspacing="0" cellpadding="0" style="margin: 28px 0; width: 100%;">
                <tr>
                  <td align="center" style="background-color: #0b0f17; border-radius: 8px; border: 1px dashed rgba(45, 212, 191, 0.4); padding: 18px;">
                    <span style="font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #2dd4bf; font-family: monospace;">
                      {{ .Token }}
                    </span>
                  </td>
                </tr>
              </table>

              <!-- Security notice -->
              <p style="margin: 24px 0 0 0; font-size: 12px; color: #64748b; line-height: 1.5;">
                This code will expire shortly. Never share this code with anyone.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 36px; background-color: #0e141e; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.06);">
              <p style="margin: 0; font-size: 12px; color: #64748b;">
                © 2026 Time Trackr · Enterprise Time Tracking & Reporting
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
